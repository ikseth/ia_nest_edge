# Fichero plano para deploy/setup.sh. Argumento > fichero > defecto.
INSTANCE_NAME=edge

# Ruta al edge.yaml efectivo del operador. Contiene hashes de claves y no se
# versiona. Host, puerto, TLS y auditoria viven solo en ese fichero.
EDGE_CONFIG=/ruta/a/edge.yaml

# Instalar la unit y habilitarla son decisiones distintas. VERIFY=strict exige
# el servicio habilitado porque comprueba que esta activo, escucha y rechaza
# /v1/models sin credencial.
SERVICE_INSTALL=true
SERVICE_ENABLE=true
VERIFY=strict

# Usuario que ejecuta el servicio y puede leer edge.yaml. Vacio toma SUDO_USER
# o el usuario que lanza setup. Una configuracion existente se preserva;
# REPLACE_CONFIG=true autoriza sustituirla por EDGE_CONFIG.
OPERATOR_USER=
REPLACE_CONFIG=false
