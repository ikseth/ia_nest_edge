# Configuracion de ejemplo de ia_nest_edge.
# Copiar fuera del repositorio y no versionar el fichero efectivo.
# No contiene identidades: cuentas, personas, claves, perfiles y clases viven
# en el directorio.

server:
  host: "127.0.0.1"
  port: 8080
  # tls:
  #   certfile: "/ruta/al/certificado.pem"
  #   keyfile: "/ruta/a/la-clave-privada.pem"

extended:
  base_url: "http://127.0.0.1:8001"
  connect_timeout_seconds: 30
  inactivity_timeout_seconds: 600

audit:
  path: "/opt/ia_nest/state/edge/family/audit/edge.jsonl"

directory:
  url: "ldaps://directory.internal:636"
  base_dn: "dc=example,dc=internal"
  people_dn: "ou=people,dc=example,dc=internal"
  ca_file: "/ruta/a/directory-ca.pem"
  bind_dn: "uid=ia_nest_edge,ou=services,dc=example,dc=internal"
  bind_password_file: "/ruta/a/directory-bind-password"
  timeout_seconds: 3
  key_attribute: "edge-key-sha256"
  groups:
    users: "ia_nest_users"
    services: "ia_nest_services"
    adult: "profile_adult"
    child: "profile_child"
    asserts_people: "edge_asserts_people"
    prototypes: "edge_prototypes"
    class_prefix: "edge_class_"

classes:
  open_webui:
    headers:
      chat: "X-OpenWebUI-Chat-Id"
      person: "X-OpenWebUI-User-Email"
      background_task: "X-OpenWebUI-Task"
    write_memory: true
    menus:
      adult:
        - id: "directo"
          mode: "directo"
          domain: "auto"
          default: true
        - id: "razonado"
          mode: "razonado"
          domain: "auto"
        - id: "iterativo_prototipo"
          mode: "iterativo"
          domain: "auto"
          prototype: true
      child:
        - id: "conversacion"
          mode: "directo"
          domain: "auto"
          default: true

  api:
    headers: {}
    write_memory: true
    menus:
      adult:
        - id: "directo"
          mode: "directo"
          domain: "auto"
          default: true
      child:
        - id: "conversacion"
          mode: "directo"
          domain: "auto"
          default: true

api:
  allowed_capabilities:
    - "capability.list"
    - "prompt.run"
    - "prompt.stream"
    - "reasoning.run"
    - "reasoning.stream"
    - "task.run"
    - "session.list"
    - "session.show"
    - "session.new"
    - "memory.recall"
    - "knowledge.status"
    - "runtime.health"
